version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src
      - /demo/Umbraco.Community.ArchivedUsers.DemoSite
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /src/Umbraco.Community.ArchivedUsers/Client
      - /tests/e2e
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
