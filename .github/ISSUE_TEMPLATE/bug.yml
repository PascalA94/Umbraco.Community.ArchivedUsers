name: Bug report
description: Something in Archived Users does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues: please don't open an issue.** Report them privately (see the Security tab).
        Please don't include names, email addresses or archive reasons from your site.
  - type: input
    id: umbraco
    attributes:
      label: Umbraco version
      description: The exact version, for example 18.3.0 (not "v18").
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Archived Users version
      description: For example 18.0.0-alpha.2.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQL Server, SQLite, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: On a clean install if you can. Include any ArchivedUsers settings you changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Browser console errors and server log lines, if any. The package logs user keys only.
      render: text
