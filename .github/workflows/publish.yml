name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC): no long-lived API key (AU-15)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      - name: Restore (locked)
        run: dotnet restore src/Umbraco.Community.ArchivedUsers.slnx --locked-mode

      - name: Build
        run: dotnet build src/Umbraco.Community.ArchivedUsers.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/Umbraco.Community.ArchivedUsers.slnx --no-build -c Release

      # Release gate (T21): parsed output, never the exit code.
      - name: Vulnerable packages
        run: bash build/check-vulnerable.sh

      # Only the package is packed: tests and the demo site are IsPackable=false.
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Umbraco.Community.ArchivedUsers/Umbraco.Community.ArchivedUsers.csproj \
            --no-build -c Release -p:Version=$VERSION -o ./artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
