name: Publish to NuGet

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  # All third-party build and test code (npm, vite, NuGet) runs here with read-only permissions, so none of it can
  # request the OIDC token that publishes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Two tag shapes. release/<minor>.<patch>[-suffix] (two numeric parts) packs the legacy lines, 17 and 18, at the
      # version in Directory.Build.props. release/19.<minor>.<patch>[-suffix] (three, starting 19.) packs 19 only, at
      # the tag's version, for example release/19.0.0-rc.1. The shapes cannot clash, and both match the release/* trigger.
      - name: Read the tag
        id: tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          sfx='(-[0-9A-Za-z][0-9A-Za-z.-]*)?'
          if [[ "$tag" =~ ^release/19\.[0-9]+\.[0-9]+${sfx}$ ]]; then
            lines="19"; pack_version="${tag#release/}"; sdk="11.x"
          elif [[ "$tag" =~ ^release/[0-9]+\.[0-9]+${sfx}$ ]]; then
            lines="$(grep -E '^[0-9]+$' eng/lines.txt | grep -vx 19 | tr '\n' ' ')"; pack_version=""; sdk="10.x"
          else
            echo "Unexpected tag $tag" >&2; exit 1
          fi
          {
            echo "lines=$lines"
            echo "pack_version=$pack_version"
            echo "expected=$(wc -w <<<"$lines" | tr -d ' ')"
            echo "sdk=$sdk"
          } >> "$GITHUB_OUTPUT"

      # One branch carries every line, so a tag publishes only from main (review C-13).
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version files match the tag
        run: bash build/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.ArchivedUsers/Client/.nvmrc

      # The same client gates as build.yml, so a tag never publishes a client that CI did not check.
      - name: Client build, XSS guard, tests and wwwroot drift
        run: |
          cd src/Umbraco.Community.ArchivedUsers/Client
          npm ci --ignore-scripts
          npm run build
          npm test
          cd ../../..
          bash build/check-xss.sh
          git diff --exit-code -- src/Umbraco.Community.ArchivedUsers/wwwroot
          test -z "$(git status --porcelain -- src/Umbraco.Community.ArchivedUsers/wwwroot)"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 11.x for a 19 tag (net11.0 only), 10.x for the 17 and 18 lines.
          dotnet-version: ${{ steps.tag.outputs.sdk }}

      # Hosted images ship SDK 11, and with no global.json `dotnet` would pick it for 17 and 18 too. Pin the line's SDK.
      - name: Pin the SDK to the line
        run: bash build/pin-sdk.sh ${{ steps.tag.outputs.sdk == '11.x' && '11' || '10' }}

      # Every line the tag selects is restored (locked), built, tested and checked for known advisories before anything
      # is packed. The advisory gate (T21) reads parsed output, never the exit code.
      - name: Build, test and audit the lines
        env:
          LINES: ${{ steps.tag.outputs.lines }}
        run: |
          # Lines come from a word list, not `while read < file`: a dotnet child reading stdin would otherwise end the loop early.
          for line in $LINES; do
            echo "== Umbraco $line"
            dotnet restore src/Umbraco.Community.ArchivedUsers.slnx "-p:UmbracoMajor=$line" --locked-mode
            dotnet build src/Umbraco.Community.ArchivedUsers.slnx --no-restore -c Release "-p:UmbracoMajor=$line"
            dotnet test src/Umbraco.Community.ArchivedUsers.slnx --no-build -c Release "-p:UmbracoMajor=$line"
            UmbracoMajor="$line" bash build/check-vulnerable.sh
          done

      # One nupkg per line, each carrying wwwroot. Only the package is packed: tests and the demo site are
      # IsPackable=false. pack.sh stamps the line's version into the manifest and restores it afterwards.
      - name: Pack
        env:
          LINES: ${{ steps.tag.outputs.lines }}
          PACK_VERSION: ${{ steps.tag.outputs.pack_version }}
        run: bash build/pack.sh ./artifacts

      - name: Packages contain the client bundle
        env:
          LINES: ${{ steps.tag.outputs.lines }}
          PACK_VERSION: ${{ steps.tag.outputs.pack_version }}
          EXPECTED: ${{ steps.tag.outputs.expected }}
        run: |
          shopt -s nullglob
          packs=(./artifacts/*.nupkg)
          [ "${#packs[@]}" -eq "$EXPECTED" ] || { echo "expected $EXPECTED nupkgs, found ${#packs[@]}" >&2; exit 1; }
          # Legacy tags: the version comes from Directory.Build.props, which the tag was checked against, so the file names
          # must be <line>.<tag>. A 19 tag carries the whole version.
          want="${GITHUB_REF_NAME#release/}"
          for line in $LINES; do
            if [ -n "$PACK_VERSION" ]; then name="$PACK_VERSION"; else name="$line.$want"; fi
            [ -f "./artifacts/Umbraco.Community.ArchivedUsers.$name.nupkg" ] || { echo "missing the $name nupkg" >&2; exit 1; }
          done
          for f in "${packs[@]}"; do
            unzip -l "$f" | grep -q 'staticwebassets/index.js' || { echo "$f has no staticwebassets/index.js" >&2; exit 1; }
            # Per-line NuGet lock files must not ship in the package.
            listing="$(unzip -Z1 "$f")"
            case "$listing" in *lock.json*) echo "$f contains a lock file" >&2; exit 1;; esac
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  # The only job that can mint the OIDC token. It checks out nothing and runs no project code: it downloads the
  # packages the build job made and pushes them. A required reviewer approves each run (environment `nuget`).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC): no long-lived API key

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
