reason = "Affects Umbraco.Cms.Api.Management < 14.3.3 and 15.0.0-rc1 to 15.2.3 only; the package floors are 17.8.0, 18.3.0 and 19.0.0-rc1 (OSV query for 18.3.0 returns no vulnerabilities)."
