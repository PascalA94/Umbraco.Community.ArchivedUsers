# osv-scanner reads the csproj version range [18.3.0, 19.0.0) as a version and matches advisories fixed long before
# the floor. The lock files pin the resolved versions and are scanned too (build.yml names each packages.<line>.lock.json with -L, because osv-scanner only recognises the exact name packages.lock.json), so real issues on 18.3.x are still reported.
[[IgnoredVulns]]
id = "GHSA-6ffg-mjg7-585x"
reason = "Affects Umbraco.Cms.Api.Management < 14.3.3 and 15.0.0-rc1 to 15.2.3 only; the package floors are 17.8.0 and 18.3.0 (OSV query for 18.3.0 returns no vulnerabilities)."
