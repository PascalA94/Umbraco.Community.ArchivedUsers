# osv-scanner reads the csproj version ranges ([17.8.0, 18.0.0), [18.3.0, 19.0.0), [19.0.0-rc1, 20.0.0)) as versions and matches advisories fixed long before
# the floor. The lock files pin the resolved versions and are scanned too (build.yml names each packages.<line>.lock.json with -L, because osv-scanner only recognises the exact name packages.lock.json), so real issues on 17.8.x, 18.3.x and 19.0.0-rc1 are still reported.
